[workspace]
members = [
    ".",
    "crates/lumzel-frame",
]
resolver = "2"

[package]
name = "lumzel-relay"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Zero-retention, end-to-end encrypted relay and bot MCP gateway for Lumzel"
readme = "README.md"
repository = "https://github.com/lumzel/relay"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
lumzel-frame = { path = "crates/lumzel-frame" }
rand = "0.8.5"
serde_json = "1"
sha2 = "0.10.8"
subtle = "2.6.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
lumzel-frame = { path = "crates/lumzel-frame" }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
